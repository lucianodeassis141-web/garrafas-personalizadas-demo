<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garrafas · Versão Celular</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#2b2d31;font:14px Inter,system-ui,sans-serif;color:#cfd2d6;padding:24px 0}
  .troca{display:flex;gap:8px}
  .troca button{border:1px solid #4a4d55;background:#1d1f23;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font:600 13px Inter,system-ui,sans-serif}
  .troca button[aria-pressed="true"]{background:#d7262f;border-color:#d7262f}
  .aparelho{width:390px;height:844px;border-radius:54px;padding:12px;background:#0b0b0d;box-shadow:0 0 0 2px #3a3c42,0 30px 80px rgba(0,0,0,.5);position:relative}
  .aparelho::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:#0b0b0d;z-index:2}
  iframe{width:100%;height:100%;border:0;border-radius:42px;background:#fff}
</style>
</head>
<body>
  <div class="troca">
    <button data-v="index.html" aria-pressed="true">Versão branca</button>
    <button data-v="preta.html" aria-pressed="false">Versão preta</button>
  </div>
  <div class="aparelho"><iframe id="tela" src="index.html" title="Site no celular"></iframe></div>
  <script>
    document.querySelectorAll('.troca button').forEach(function(b){
      b.onclick = function(){
        document.getElementById('tela').src = b.dataset.v;
        document.querySelectorAll('.troca button').forEach(function(x){ x.setAttribute('aria-pressed', x === b); });
      };
    });
  </script>
</body>
</html>
